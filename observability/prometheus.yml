global:
  scrape_interval: 15s

scrape_configs:
  # App metrics the collector received over OTLP
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # The collector's own health metrics
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
