[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]

[tool.ruff]
# Resolve first-party imports (app, conftest) from backend/, so ruff sorts
# imports the same way whether it runs from the repo root or from backend/.
src = ["."]
