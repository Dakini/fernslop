AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fernslop - the account's GitHub OIDC provider and one deploy role per GitHub environment (development,
  production). Each role trusts only its own environment and can only send its own stack's SSM deploy document
  (<stack name>-deploy, ec2-stack.yaml) to its own instance. CI never uses CloudFormation. Deployed once by an
  operator as stack fernslop-github (infra/README.md); deploy.sh never touches it.

Parameters:
  AppPrefix:
    Type: String
    Default: fernslop
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: lowercase letters, digits and hyphens only
    Description: >
      The same prefix the app stacks use (infra/deploy.sh APP_PREFIX). Development's stack, instance Name tag
      and deploy document are <AppPrefix> and <AppPrefix>-deploy; production's are prod-<AppPrefix> and
      prod-<AppPrefix>-deploy.
  GitHubRepo:
    Type: String
    Default: Dakini/fernslop
    Description: owner/name of the repository whose workflows may assume the deploy roles
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      false when the account already has the token.actions.githubusercontent.com provider (an account can
      only have one); then set ExistingOidcProviderArn.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of the existing GitHub OIDC provider (aws iam list-open-id-connect-providers)

Rules:
  ProviderArnRequired:
    RuleCondition: !Equals [!Ref CreateOidcProvider, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingOidcProviderArn, ""]]
        AssertDescription: With CreateOidcProvider=false, ExistingOidcProviderArn is required.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # Other stacks (ecr-stack.yaml's push role) trust this provider, so deleting this stack or replacing the
  # resource must leave it in the account.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Assumed by jobs that use the GitHub "development" environment. It can send the development stack's deploy
  # document to the development instance and read the result; nothing else. AWS-RunShellScript, CloudFormation,
  # ECR, S3, IAM and EC2 are all out of reach.
  DevelopmentDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Lets ${GitHubRepo} jobs in the development environment run ${AppPrefix}-deploy on the ${AppPrefix} instance"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:environment:development"
      Policies:
        - PolicyName: send-deploy-document
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The document and the instance are separate resources of the one call, so separate statements.
              # ec2-stack.yaml tags the instance Name=<stack name>; its ID changes when it is replaced.
              - Sid: SendTheDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${AppPrefix}-deploy"
              - Sid: ToTheInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition: { StringEquals: { "ssm:resourceTag/Name": !Ref AppPrefix } }
              # Wait for the result (these actions take no resource ARN)
              - Sid: ReadTheResult
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

  # Assumed by jobs that use the GitHub "production" environment. Same rights as development, on prod's names.
  # It trusts the environment, not the branch: limit the environment's deployment branches to main in GitHub.
  ProductionDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub "Lets ${GitHubRepo} jobs in the production environment run prod-${AppPrefix}-deploy on the prod-${AppPrefix} instance"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:environment:production"
      Policies:
        - PolicyName: send-deploy-document
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendTheDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/prod-${AppPrefix}-deploy"
              - Sid: ToTheInstance
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition: { StringEquals: { "ssm:resourceTag/Name": !Sub "prod-${AppPrefix}" } }
              - Sid: ReadTheResult
                Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

Outputs:
  DevelopmentDeployRoleArn:
    Description: Variable AWS_DEPLOY_ROLE_ARN of the GitHub environment development
    Value: !GetAtt DevelopmentDeployRole.Arn
  ProductionDeployRoleArn:
    Description: Variable AWS_DEPLOY_ROLE_ARN of the GitHub environment production
    Value: !GetAtt ProductionDeployRole.Arn
