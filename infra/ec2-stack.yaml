AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Fernslop - one small EC2 instance running the app and Postgres with docker compose, fronted by Caddy,
  with logs and a dashboard in CloudWatch. Serves HTTPS on DomainName (required) with an automatic Let's
  Encrypt certificate; AllowPlainHttp=true serves plain HTTP on the Elastic IP instead. One instance only: the live SSE feed is in-process
  (backlog/parked/090-api-live-multi-worker.md). The database lives on the instance's disk and is dumped
  nightly to the BackupBucket; replacing the instance loses changes since the last dump (infra/README.md).

Parameters:
  AppPrefix:
    Type: String
    Default: fernslop
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: lowercase letters, digits and hyphens only
    Description: >
      The ECR repository (shared by both environments) and the App tag. infra/deploy.sh passes APP_PREFIX.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: >
      dev names everything <AppPrefix> (the stack, log group /<AppPrefix>/app, dashboard, instance Name tag);
      prod names them prod-<AppPrefix>. Also the Environment tag and the BackupSucceeded dimension.
  ImageTag:
    Type: String
    AllowedPattern: "^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$"
    ConstraintDescription: an image tag built by infra/build.sh, YYYYMMDD-HHMMSS-<7-char sha>
    Description: >
      The app image a new or replaced instance boots (written to /opt/app/.env as APP_TAG). Later deploys run the
      <stack name>-deploy SSM document and never change this; infra/deploy.sh passes the stack's previous value.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0123456789abcdef0
    Description: Default VPC
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0123456789abcdef0
    Description: Default subnet (eu-west-2a)
  InstanceType:
    Type: String
    Default: t4g.micro
    Description: ARM (the image is built for linux/arm64). t4g.nano (0.5 GB) is too small for the app plus Postgres.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Used only when AmiId is empty, i.e. when the stack is first created.
  AmiId:
    Type: String
    Default: ""
    Description: >
      The instance's AMI. Empty uses LatestAmiId; infra/deploy.sh passes the running instance's AMI on every
      update, because LatestAmiId re-resolves and a newer image would replace the instance.
  DomainName:
    Type: String
    Default: ""
    Description: >
      Required unless AllowPlainHttp=true. Its DNS must point at the Elastic IP; Caddy then gets a Let's Encrypt
      certificate for it.
  AllowPlainHttp:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to run without DomainName, serving plain HTTP on the Elastic IP (no TLS).

Rules:
  DomainRequired:
    RuleCondition: !Equals [!Ref AllowPlainHttp, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainName, ""]]
        AssertDescription: >
          DomainName is required (the site is served over HTTPS). To run plain HTTP on the Elastic IP
          instead, set AllowPlainHttp=true.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  IsProd: !Equals [!Ref Environment, prod]
  HasAmiId: !Not [!Equals [!Ref AmiId, ""]]

# Physical names: dev keeps exactly the names it had before environments existed (renaming the log group or
# dashboard, or changing the security group description, replaces the resource); prod is prefixed prod-, so
# neither it nor what CloudFormation generates from its stack name matches dev's <AppPrefix>-* patterns.
# Every resource that takes tags carries App=<AppPrefix> and Environment=<Environment>.
Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - "/${Name}/app"
        - Name: !If [IsProd, !Sub "prod-${AppPrefix}", !Ref AppPrefix]
      RetentionInDays: 14
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fernslop - HTTP/HTTPS inbound only, no SSH (use SSM Session Manager)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }
      Policies:
        - PolicyName: pull-image-and-write-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${AppPrefix}"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
        - PolicyName: write-db-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Write-only: no get, list or delete, so a compromised instance can neither read nor wipe old dumps.
              # PutObject also covers the multipart upload a streamed `aws s3 cp -` makes.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${BackupBucket.Arn}/db/*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": Fernslop } }

  # Nightly pg_dump of the compose db (see infra/README.md). Retained when the stack is deleted.
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-db-dumps
            Status: Enabled
            Prefix: db/
            ExpirationInDays: 30
            # A streamed upload that dies half way leaves parts the instance may not abort itself
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt BackupBucket.Arn, !Sub "${BackupBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !If [HasAmiId, !Ref AmiId, !Ref LatestAmiId]
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        # IMDSv2 only, and one hop: containers (an extra network hop away) cannot read the instance role's credentials
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: !If [IsProd, !Sub "prod-${AppPrefix}", !Ref AppPrefix] }
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # No -x: this script writes a generated Postgres password to disk. cloud-init logs to
          # /var/log/cloud-init-output.log.
          set -euo pipefail

          echo "=== swap ==="
          # 1 GB of RAM is shared by Postgres, the app and Caddy
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          echo "=== docker ==="
          dnf install -y docker
          systemctl enable --now docker
          # Amazon Linux 2023's docker package ships no compose plugin. A fixed release, checked against its
          # published SHA-256 before it is installed; a mismatch stops this script (set -e). To bump: take both
          # values from https://github.com/docker/compose/releases/download/<version>/checksums.txt
          COMPOSE_VERSION=v5.6.1
          case "$(uname -m)" in
            x86_64) COMPOSE_SHA256=47737f4236e6d3ccea7291995203f8f018058783b4c3a9469119811a0b5db8c0 ;;
            aarch64) COMPOSE_SHA256=42cfa75f51ad0ccf290bad37899e0038a8c10a0069e85233ecc1d53e3ff1347d ;;
            *) echo "No docker compose checksum for $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-$(uname -m)" \
            -o /tmp/docker-compose
          echo "$COMPOSE_SHA256  /tmp/docker-compose" | sha256sum -c -
          mkdir -p /usr/local/lib/docker/cli-plugins
          install -m 755 /tmp/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
          rm /tmp/docker-compose

          echo "=== compose files ==="
          mkdir -p /opt/app
          cd /opt/app

          cat > docker-compose.yaml <<'COMPOSE'
          x-logging: &logging
            driver: awslogs
            options:
              awslogs-region: ${AWS::Region}
              awslogs-group: ${LogGroup}
              tag: "{{.Name}}"

          # Images pinned by multi-arch index digest; to bump one:
          #   docker buildx imagetools inspect postgres:17-alpine | grep -m1 Digest
          # Each service reads only its own env file (written below, mode 600).
          services:
            db:
              image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
              env_file: db.env
              environment:
                POSTGRES_USER: fernslop
                POSTGRES_DB: fernslop
              volumes:
                - pgdata:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fernslop -d fernslop"]
                interval: 5s
                timeout: 3s
                retries: 10
                start_period: 10s
              logging: *logging
              restart: unless-stopped

            app:
              # APP_TAG comes from /opt/app/.env: the boot tag below, then whatever the deploy document set
              image: ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppPrefix}:${!APP_TAG}
              env_file: app.env
              environment:
                # Only Caddy (its fixed address below) may set the client IP with X-Forwarded-For;
                # the per-IP rate limits and the access logs use it.
                FORWARDED_ALLOW_IPS: 172.30.0.10
              depends_on:
                db:
                  condition: service_healthy
              logging: *logging
              restart: unless-stopped

            caddy:
              image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
              env_file: caddy.env
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
              networks:
                default:
                  ipv4_address: 172.30.0.10
              depends_on:
                - app
              logging: *logging
              restart: unless-stopped

          networks:
            default:
              ipam:
                config:
                  - subnet: 172.30.0.0/24

          volumes:
            pgdata:
            caddy_data:
            caddy_config:
          COMPOSE

          cat > Caddyfile <<'CADDY'
          {$SITE_ADDRESS} {
              # Caddy trusts no proxy in front of it: it drops a client-sent X-Forwarded-For and
              # sends the real peer address, which the app trusts from 172.30.0.10 only.
              # -1 flushes immediately, which the live SSE stream needs
              reverse_proxy app:8000 {
                  flush_interval -1
                  # Read the body (up to the request_body limit below) before contacting the app, so an
                  # oversize one is refused here and never reaches it
                  request_buffers 6MB
              }

              # Just above the app's own limits (5 MB photo, 64 KB JSON), leaving room for multipart
              # overhead; a bigger body gets a bare 413 here and never reaches the app
              @photo_upload path /api/photos /api/plants/identify
              request_body @photo_upload {
                  max_size 6MB
              }
              @other_body not path /api/photos /api/plants/identify
              request_body @other_body {
                  max_size 1MB
              }

              # CSP: the SPA's inline bootstrap scripts change with every build (asset hashes, build
              # time), so they cannot be pinned by hash from here; everything else is same-origin
              # except Google Fonts. Images: same-origin photos plus data:/blob: previews.
              header {
                  Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
                  X-Content-Type-Options nosniff
                  Referrer-Policy strict-origin-when-cross-origin
                  X-Frame-Options DENY
              }
              @https protocol https
              header @https Strict-Transport-Security "max-age=31536000"
          }
          CADDY

          echo "=== environment ==="
          # One file per service, each mode 600: only db and app see the password, Caddy only its address
          umask 077
          PGPASSWORD=$(openssl rand -hex 32)
          if [ -n "${DomainName}" ]; then
            SITE_ADDRESS="${DomainName}"
            PUBLIC_URL="https://${DomainName}"
          else
            SITE_ADDRESS=":80"
            PUBLIC_URL="http://${ElasticIp}"
          fi
          echo "POSTGRES_PASSWORD=$PGPASSWORD" > db.env
          {
            echo "FERNSLOP_DATABASE_URL=postgresql+psycopg://fernslop:$PGPASSWORD@db:5432/fernslop"
            echo "FERNSLOP_PUBLIC_URL=$PUBLIC_URL"
            # No Swagger UI, ReDoc or OpenAPI JSON in production
            echo "FERNSLOP_API_DOCS=0"
          } > app.env
          echo "SITE_ADDRESS=$SITE_ADDRESS" > caddy.env
          # Read by docker compose for ${!APP_TAG} in the compose file; the deploy document replaces this line
          echo "APP_TAG=${ImageTag}" > .env
          chmod 600 db.env app.env caddy.env .env

          echo "=== db backups ==="
          # Nightly custom-format pg_dump streamed straight to S3 (never written to this disk), then a
          # BackupSucceeded metric; the BackupMissingAlarm fires when none arrives for 26 hours.
          cat > /usr/local/bin/fernslop-backup <<'BACKUP'
          #!/bin/bash
          # No -x and no output of the dump: it holds follower emails and photos.
          set -euo pipefail
          cd /opt/app
          key="db/fernslop-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker compose exec -T db pg_dump -U fernslop -d fernslop -Fc \
            | aws s3 cp - "s3://${BackupBucket}/$key" --region ${AWS::Region} --only-show-errors
          aws cloudwatch put-metric-data --region ${AWS::Region} \
            --namespace Fernslop --metric-name BackupSucceeded --value 1 --unit Count \
            --dimensions Environment=${Environment}
          echo "backup uploaded: s3://${BackupBucket}/$key"
          BACKUP
          chmod 700 /usr/local/bin/fernslop-backup

          cat > /etc/systemd/system/fernslop-backup.service <<'UNIT'
          [Unit]
          Description=Fernslop Postgres dump to S3
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          Environment=HOME=/root
          ExecStart=/usr/local/bin/fernslop-backup
          UNIT

          cat > /etc/systemd/system/fernslop-backup.timer <<'UNIT'
          [Unit]
          Description=Nightly Fernslop Postgres dump to S3

          [Timer]
          OnCalendar=*-*-* 03:00:00 UTC
          Persistent=true

          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable --now fernslop-backup.timer

          echo "=== start ==="
          aws ecr get-login-password --region ${AWS::Region} | \
            docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          docker compose up -d --pull always

          echo "=== housekeeping timers ==="
          # Each run is a one-off app container, so its output goes to the CloudWatch log group too.
          # Persistent=true runs a missed tick at boot.
          cat > /etc/systemd/system/fernslop-task@.service <<'UNIT'
          [Unit]
          Description=Fernslop housekeeping: python -m app.%i
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          WorkingDirectory=/opt/app
          ExecStart=/usr/bin/docker compose run --rm -T app python -m app.%i
          UNIT
          cat > /etc/systemd/system/fernslop-photo-cleanup.timer <<'UNIT'
          [Unit]
          Description=Delete unposted photos hourly

          [Timer]
          OnCalendar=hourly
          Persistent=true
          Unit=fernslop-task@photo_cleanup.service

          [Install]
          WantedBy=timers.target
          UNIT
          cat > /etc/systemd/system/fernslop-room-purge.timer <<'UNIT'
          [Unit]
          Description=Purge soft-deleted gardens daily

          [Timer]
          OnCalendar=daily
          Persistent=true
          Unit=fernslop-task@room_purge.service

          [Install]
          WantedBy=timers.target
          UNIT
          systemctl daemon-reload
          systemctl enable --now fernslop-photo-cleanup.timer fernslop-room-purge.timer
          echo "=== bootstrap complete ==="

  # The deploy procedure lives here, in the template, not in the workflow or script that triggers it. CI's role
  # may send this document and nothing else (infra/github-oidc-stack.yaml), so the worst a stolen token can do is
  # run an image that is already in ECR; AWS-RunShellScript would be root on the instance. It runs an existing
  # tag: building is infra/build.sh's job.
  DeployDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Sub "${AWS::StackName}-deploy"
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      UpdateMethod: NewVersion
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }
      Content:
        schemaVersion: "2.2"
        description: >-
          Run an image tag that infra/build.sh already pushed: set APP_TAG in /opt/app/.env, pull that image and
          restart what changed. The compose file's app image must be <repo>:$APP_TAG.
        parameters:
          tag:
            type: String
            description: Image tag to run, YYYYMMDD-HHMMSS-<7-char sha>.
            # SSM rejects any other value, so the one thing injected into the script cannot carry shell syntax
            allowedPattern: "^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$"
        mainSteps:
          - action: aws:runShellScript
            name: deploy
            inputs:
              timeoutSeconds: "1800"
              runCommand:
                - !Sub |
                  set -euo pipefail
                  cd /opt/app
                  # An instance built before tags would silently re-pull :latest; stop instead
                  if ! grep -qF -- '${!APP_TAG}' docker-compose.yaml; then
                    echo 'Not deployed: the app image in /opt/app/docker-compose.yaml is not <repo>:${!APP_TAG} (see infra/README.md)' >&2
                    exit 1
                  fi
                  aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
                  # Replace only the APP_TAG line; an older instance keeps its other .env lines
                  umask 077
                  touch .env
                  { awk '!/^APP_TAG=/' .env; echo 'APP_TAG={{ tag }}'; } > .env.new
                  mv .env.new .env
                  docker compose up -d --pull always
                  docker image prune -f

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  # Replaces the instance's hardware if the host under it fails (no notification target needed)
  RecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the Fernslop instance when the system status check fails
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub "arn:aws:automate:${AWS::Region}:ec2:recover"]
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  # ALARM when no nightly backup has succeeded for 26 hours: 26 hourly periods, each with no
  # BackupSucceeded data point (missing data counts as breaching). Only this environment's backups count.
  BackupMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub "No Fernslop ${Environment} database backup reached S3 in the last 26 hours (see infra/README.md)"
      Namespace: Fernslop
      MetricName: BackupSucceeded
      Dimensions: [{ Name: Environment, Value: !Ref Environment }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 26
      DatapointsToAlarm: 26
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Tags:
        - { Key: App, Value: !Ref AppPrefix }
        - { Key: Environment, Value: !Ref Environment }

  # Takes no tags
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !If [IsProd, !Sub "prod-${AppPrefix}", !Ref AppPrefix]
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "CPU (%) and CPU credit balance", "region": "${AWS::Region}", "stat": "Average", "period": 60,
            "metrics": [
              ["AWS/EC2", "CPUUtilization", "InstanceId", "${Instance}"],
              ["AWS/EC2", "CPUCreditBalance", "InstanceId", "${Instance}", {"yAxis": "right"}]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "Network (bytes)", "region": "${AWS::Region}", "stat": "Sum", "period": 60,
            "metrics": [
              ["AWS/EC2", "NetworkIn", "InstanceId", "${Instance}"],
              ["AWS/EC2", "NetworkOut", "InstanceId", "${Instance}"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
            "title": "Status checks failed", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
            "metrics": [
              ["AWS/EC2", "StatusCheckFailed_Instance", "InstanceId", "${Instance}"],
              ["AWS/EC2", "StatusCheckFailed_System", "InstanceId", "${Instance}"]]}},
          {"type": "alarm", "x": 12, "y": 6, "width": 6, "height": 6, "properties": {
            "title": "Nightly database backup", "alarms": ["${BackupMissingAlarm.Arn}"]}},
          {"type": "metric", "x": 18, "y": 6, "width": 6, "height": 6, "properties": {
            "title": "Backups uploaded (per day)", "region": "${AWS::Region}", "stat": "Sum", "period": 86400,
            "metrics": [["Fernslop", "BackupSucceeded", "Environment", "${Environment}"]]}},
          {"type": "log", "x": 0, "y": 12, "width": 24, "height": 8, "properties": {
            "title": "Logs (app, db, caddy)", "region": "${AWS::Region}", "view": "table",
            "query": "SOURCE '${LogGroup}' | fields @timestamp, @logStream, @message | sort @timestamp desc | limit 100"}}
        ]}

Outputs:
  Url:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "http://${ElasticIp}"]
  ElasticIp:
    Value: !Ref ElasticIp
  InstanceId:
    Value: !Ref Instance
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
  LogGroupName:
    Value: !Ref LogGroup
