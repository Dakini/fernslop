openapi: 3.1.0
info:
  title: Fernslop API
  version: 0.1.0
  description: |
    The backend the Fernslop frontend expects.

    The UI calls the backend only through the `GardenService` interface
    (`frontend/src/services/types.ts`). It currently runs against an in-browser mock
    (`frontend/src/services/mock/mockService.ts`). Each operation below maps 1:1 to a
    `GardenService` method, named in `x-service-method`. Status codes and error
    messages follow the mock's behaviour.

    ## Authentication
    There are **no user accounts** and **no endpoint requires authentication**. Anyone
    with a room's link can read and edit it.

    Edits to a room's contents are made by an anonymous **actor**: a random
    `device_id` (UUID) and a display name, stored in the browser's localStorage
    (`frontend/src/lib/identity.ts`). Those endpoints require the `X-Device-Id` and
    `X-Actor-Name` headers, which the server records on the feed event it writes.
    They are self-asserted. The server uses them to attribute edits, not to authorise
    them. In this spec they are modelled as the `actor` security scheme, so
    "requires actor" means "requires these headers".

    Threat model: names are self-asserted, so anyone can post as "Ada" and nothing
    proves two edits came from the same person. Look-alike letters (a Cyrillic "А"
    for a Latin "A") are not filtered. The server only rejects control and format
    characters (and line and paragraph separators) in names, labels and post text.

    Each follow has one secret token, a bearer capability for both confirming the follow
    and unsubscribing. It only ever goes out in emails, in the URL fragment of
    `<FERNSLOP_PUBLIC_URL>/confirm-follow#token=…` and `<FERNSLOP_PUBLIC_URL>/unsubscribe#token=…`
    (browsers never send the fragment, so it stays out of access logs); the pages send it
    in a JSON body. The unsubscribe page still accepts the older `?token=` link.

    ## Errors
    Every error response has an `Error` body. The frontend shows `message` directly
    to the user (for example in a toast), so it must be a short, human-readable message.

    Every operation with a JSON request body takes at most 64 KB, sent as
    `application/json`, and answers `413` or `415` otherwise (see
    `components/responses/JsonBodyTooLarge` and `NotJson`).

    ## Soft deletes
    Room plants and areas are never hard-deleted. Removing one sets `deleted_at`,
    so the action can be undone. Rows with `deleted_at` set are never returned by
    the read endpoints.

    Rooms are soft-deleted too: `deleteRoom` marks the room deleted and keeps
    everything in it. From then on the room is left out of `listRooms` and every
    other call on it answers 404, exactly like a room that never existed; the
    deletion time is never returned. Users cannot undo it, but for 7 days an
    operator can restore the room with all its data (`python -m app.room_restore`).
    After 7 days a purge job (`python -m app.room_purge`) removes the room for good
    with its plants, areas, feed events, follows, and the photos only its posts used.
    Until the purge, the photos of a deleted room stay reachable by their URL.

    ## Room identity and limits
    Rooms are identified by a server-generated UUID (`Room.id`), which is also the
    public URL segment (`/r/{roomId}`). Rooms have no slugs, so two rooms can have the
    same name without clashing.

    A room may hold at most **50 live plants** and **10 live areas**. Soft-deleted rows
    don't count. The server must enforce these limits on create and on any undo that
    would bring a removed plant or area back. Exceeding a limit returns `409`.

    ## Room activity
    Every successful room mutation (except following a room) updates the room's
    `last_activity_at` and pushes a `change` message to that room's live-update stream.
servers:
  - url: /api
    description: Same-origin API prefix (choose any; the frontend has no base URL yet)

security: []

tags:
  - name: Rooms
  - name: Plants
    description: The read-only plant reference table
  - name: Room plants
    description: Plants placed on a room's canvas
  - name: Areas
    description: Labelled areas (beds, ponds) on a room's canvas
  - name: Feed
  - name: Photos
  - name: Follows
  - name: Realtime

paths:
  /rooms:
    get:
      tags: [Rooms]
      operationId: listRooms
      x-service-method: listRooms
      summary: List rooms with thumbnail data, one page at a time
      description: |
        Sorted by `last_activity_at`, most recent first (then `created_at`, then `id`). Excludes
        deleted rooms and soft-deleted plants and areas. Returns at most `limit` rooms plus `next`,
        the cursor to pass as `before` for the following page; `next` is null on the last page.
        Runs the same number of queries whatever the number of rooms. A room whose activity
        changes between two page requests can move to an earlier page, so clients should drop
        rooms they already show.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size. Anything but a whole number from 1 to 100 is a 400.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          required: false
          description: Opaque cursor from a previous page's `next`. A malformed one is a 400.
          schema: { type: string }
      responses:
        "200":
          description: One page of room summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Rooms]
      operationId: createRoom
      x-service-method: createRoom
      summary: Create a room
      description: |
        Trims all fields and assigns a new UUID as `id`. This endpoint does not require an
        actor and writes no feed event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoomInput" }
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Room" }
        "400":
          description: |
            Invalid request body. A control or format character in a field gives
            `Name contains invalid characters` (or `Description ...`, `Region ...`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}:
    get:
      tags: [Rooms]
      operationId: getRoomState
      x-service-method: getRoomState
      summary: Get everything needed to render a room
      description: |
        Returns live (not soft-deleted) plants and areas, plus the newest 50 feed events, newest
        first, and `feed_next`, the cursor for older ones (`getRoomFeed`), null when there are none.
        The feed includes events that were undone; their `undone_at` is set.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Room state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
        "404":
          description: No room with this id. The frontend shows its "garden not found" page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Rooms]
      operationId: deleteRoom
      x-service-method: deleteRoom
      summary: Delete a room (soft delete, purged after 7 days)
      description: |
        Marks the room deleted; nothing in it is removed yet (see "Soft deletes").
        The room disappears from `listRooms`, every other call on it answers 404, and
        the weekly digest skips it. Open `/rooms/{roomId}/live` streams get a final
        `change` message and end. Users cannot undo it; for 7 days an operator can
        restore it. After that a purge removes the room and all its plants (including
        removed ones), areas, feed events (including undone ones) and follows for good,
        plus any photo only this room's posts use; a follow's old unsubscribe link then
        answers "already unsubscribed".
        Anyone with the link can call it: no actor headers.

        Idempotent: it answers 204 whether the room was just deleted, was already deleted
        (a second call, or two people confirming at the same moment) or never existed (also
        an id that is not a UUID). Only the call that marks the room changes anything.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: The room is deleted (now, or already before).
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /plants:
    get:
      tags: [Plants]
      operationId: listPlants
      x-service-method: listPlants
      summary: List the whole plant reference table
      description: "The frontend caches this response forever (`staleTime: Infinity`), so it should be stable."
      responses:
        "200":
          description: All plants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plant" }

  /plants/search:
    get:
      tags: [Plants]
      operationId: searchPlants
      x-service-method: searchPlants
      summary: Search plants by name
      description: |
        Case-insensitive substring match on `common_name` or `scientific_name`.
        Returns at most 12 plants, in reference-table order. If `q` is empty or only whitespace,
        returns the first 12 plants.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, default: "" }
      responses:
        "200":
          description: Matching plants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plant" }

  /plants/identify:
    post:
      tags: [Plants]
      operationId: identifyPlant
      x-service-method: identifyPlant
      summary: Identify a plant from a photo
      description: |
        Sends the photo to a third-party plant ID API using a server-side key, then maps the
        results to rows in the plant reference table. Returns up to 3 candidates, highest
        confidence first. The user picks one before anything is added to a room.

        Limited to 20 calls an hour and 20 a day per client IP (`429`, see `TooManyRequests`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, at most 5 MB (5 × 1024 × 1024 bytes).
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: Candidates (may be empty)
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items: { $ref: "#/components/schemas/IdentifyCandidate" }
        "413":
          description: File is over 5 MB. Message is `That photo is over 5 MB`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: File is not JPEG, PNG or WebP. Message is `Please use a JPG, PNG or WebP image`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The upstream identification API failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/plants:
    post:
      tags: [Room plants]
      operationId: addPlant
      x-service-method: addPlant
      summary: Add a plant to a room
      description: |
        Places the plant at the canvas centre (`x_pct` = `y_pct` = 50) with `added_by_name`
        set to the actor's name. Writes a `plant_added` feed event whose undo payload is
        `delete_plant`.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plant_id]
              properties:
                plant_id: { type: string }
      responses:
        "201":
          description: Plant added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomPlant" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room already has 50 live plants. Message is `This garden is full (50 plants max)`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /room-plants/{roomPlantId}:
    patch:
      tags: [Room plants]
      operationId: movePlant
      x-service-method: movePlant
      summary: Move a plant on the canvas
      description: |
        Clamps coordinates to 0–100. Writes a `plant_moved` feed event whose undo payload is
        `restore_plant` with the row as it was before the move.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomPlantId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [x_pct, y_pct]
              properties:
                x_pct: { type: number }
                y_pct: { type: number }
      responses:
        "200":
          description: Updated plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomPlant" }
        "404":
          $ref: "#/components/responses/RoomPlantGone"
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Room plants]
      operationId: removePlant
      x-service-method: removePlant
      summary: Remove a plant (soft delete)
      description: Sets `deleted_at`. Writes a `plant_removed` feed event whose undo payload is `restore_plant`.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomPlantId"
        - $ref: "#/components/parameters/ActorName"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/RoomPlantGone"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /room-plants/{roomPlantId}/care:
    post:
      tags: [Room plants]
      operationId: markCare
      x-service-method: markCare
      summary: Record that a care task was done
      description: |
        Sets the matching timestamp to now: water → `last_watered_at`, feed → `last_fed_at`,
        prune → `last_pruned_at`, harvest → `last_harvested_at`. Writes a `care_done` feed
        event whose undo payload is `restore_plant`.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomPlantId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [care]
              properties:
                care: { $ref: "#/components/schemas/CareType" }
      responses:
        "200":
          description: Updated plant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomPlant" }
        "404":
          $ref: "#/components/responses/RoomPlantGone"
        "422":
          description: |
            The plant's `<care>_every_days` interval is null or 0, so this care type
            doesn't apply. Message is `No <care> data for this plant`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/areas:
    post:
      tags: [Areas]
      operationId: addArea
      x-service-method: addArea
      summary: Add an area to a room
      description: Writes an `area_changed` feed event whose undo payload is `restore_area` with `area` set to null.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AreaInput" }
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomArea" }
        "400":
          $ref: "#/components/responses/BadAreaRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The room already has 10 live areas. Message is `This garden has the maximum 10 areas`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /areas/{areaId}:
    patch:
      tags: [Areas]
      operationId: updateArea
      x-service-method: updateArea
      summary: Update an area (rename, move, resize)
      description: |
        Partial update; omitted fields are unchanged. Writes an `area_changed` feed event whose
        undo payload is `restore_area` with the area as it was before the change.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/AreaId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AreaPatch" }
      responses:
        "200":
          description: Updated area
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomArea" }
        "400":
          $ref: "#/components/responses/BadAreaRequest"
        "404":
          $ref: "#/components/responses/AreaNotFound"
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Areas]
      operationId: deleteArea
      x-service-method: deleteArea
      summary: Remove an area (soft delete)
      description: Sets `deleted_at`. Writes an `area_changed` feed event whose undo payload is `restore_area` with the area as it was before.
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/AreaId"
        - $ref: "#/components/parameters/ActorName"
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/AreaNotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/feed:
    get:
      tags: [Feed]
      operationId: getRoomFeed
      x-service-method: getRoomFeed
      summary: Older feed events, one page at a time
      description: |
        Newest first (`created_at`, then the order events were saved), continuing exactly after
        `before`: the room state's `feed_next` or a previous page's `next`. Events that share a
        timestamp are neither skipped nor repeated, and events added since the cursor was handed
        out do not shift the pages. Without `before`, starts at the newest event. Undone events are
        included. Reads one page, not the whole feed.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: before
          in: query
          required: false
          description: Opaque cursor from `feed_next` or a page's `next`. One this room never gave out is a 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Anything but a whole number from 1 to 100 is a 400.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One page of feed events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400":
          description: A malformed or foreign `before`, or a bad `limit`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No room with this id (or it was deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rooms/{roomId}/posts:
    post:
      tags: [Feed]
      operationId: postUpdate
      x-service-method: postUpdate
      summary: Post a message and/or photo to the room feed
      description: |
        Creates a `post` feed event with no undo payload. `text` is trimmed and at least one of
        `text` and `photo_id` must be non-empty. The photo must already be uploaded with
        `POST /photos`. The server copies that photo's `url` into the event's `photo_url`,
        so clients can't put arbitrary URLs in the feed. A photo can be in one post only:
        upload it again to post it again. A room takes at most 200 posts in any 24 hours
        (undone posts count; care, plant and area events do not).
      security: [{ actor: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/ActorName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, photo_id]
              properties:
                text: { type: string }
                photo_id:
                  type: [string, "null"]
                  format: uuid
                  description: The `id` returned by `POST /photos`.
      responses:
        "201":
          description: Feed event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedEvent" }
        "400":
          description: |
            Both text and photo are empty (message `Write something or add a photo`), or
            `photo_id` doesn't match an uploaded photo (message `That photo didn't upload — try again`),
            or that photo is already in a post, in any room (message `That photo is already in a post`),
            or `text` holds a control or format character other than newline and tab (message
            `Text contains invalid characters`). `\r\n` and a lone `\r` are stored as `\n`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          description: |
            Too many writes from this client IP (see `TooManyRequests`), or the room already has 200
            posts in the last 24 hours; then `Retry-After` counts until the oldest of them is 24 hours
            old. Nothing is written. Message is `You're going a bit fast. Try again in N seconds.`
          headers:
            Retry-After:
              description: Whole seconds until a post may succeed.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /photos:
    post:
      tags: [Photos]
      operationId: uploadPhoto
      x-service-method: uploadPhoto
      summary: Upload a photo to attach to a post
      description: |
        Stores the image and returns its id and a URL to display it. The frontend uploads
        as soon as the user picks a file, shows a preview from `url`, then sends `id` as
        `photo_id` when posting. The mock stores the image in browser storage and
        returns a `data:` URL. A real backend should return `/api/photos/{id}` or an
        object-storage URL. Photos that are never posted can be cleaned up later.

        Metadata is removed before the photo is stored: EXIF (GPS position, camera,
        dates), XMP, IPTC, comments and PNG text chunks. The EXIF orientation is applied
        to the pixels first, so the photo still displays upright. The type stays the same,
        and an ICC colour profile, transparency and animation are kept. A photo without
        metadata is stored unchanged. The 5 MB limit applies to the file as sent.

        Uploads stop with 507 while the stored photo bytes are at or above
        `FERNSLOP_PHOTO_STORAGE_LIMIT_BYTES` (default 4 GiB, 4294967296), so photos cannot
        fill the server's disk. Parallel uploads may overshoot the limit by a few photos.
        Unposted photos are deleted after 6 hours (`python -m app.photo_cleanup`), which
        frees space again. The mock never reports full.

        Limited to 30 uploads an hour and 15 a day per client IP (`429`, see
        `TooManyRequests`). The mock never limits.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP, at most 5 MB (5 × 1024 × 1024 bytes).
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Photo" }
        "413":
          description: File is over 5 MB. Message is `That photo is over 5 MB`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: |
            File is not JPEG, PNG or WebP, cannot be decoded as one, or has more pixels than
            the server's decompression-bomb limit. Message is `Please use a JPG, PNG or WebP image`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "507":
          description: |
            Photo storage is full (stored photo bytes at or above
            `FERNSLOP_PHOTO_STORAGE_LIMIT_BYTES`); nothing is stored. Message is
            `Photo storage is full right now. Please try again later.`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /photos/{photoId}:
    get:
      tags: [Photos]
      operationId: getPhoto
      summary: Serve an uploaded photo
      description: |
        The image bytes with their original content type. The frontend only uses this
        through `Photo.url` and `FeedEvent.photo_url`, never by building the path itself.
        Photo ids are unguessable UUIDs, so responses can be cached publicly and indefinitely.
        The image carries no metadata (see `uploadPhoto`; photos stored earlier are stripped
        in place by `python -m app.photo_strip`). Responses also send
        `X-Content-Type-Options: nosniff` and `Content-Disposition: inline`, so a browser only
        shows them as their image type.
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: No such photo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /feed-events/{eventId}/undo:
    post:
      tags: [Feed]
      operationId: undoEvent
      x-service-method: undoEvent
      summary: Undo a feed event
      description: |
        Applies the event's `undo_payload` and sets `undone_at`. The frontend sends the actor,
        but the mock does not record who undid the event and writes no new feed event.
        - `restore_plant`: write `room_plant` back exactly, including clearing `deleted_at`.
        - `delete_plant`: soft-delete the room plant.
        - `restore_area` with `area: null`: soft-delete the area.
        - `restore_area` with an area: write that area back exactly.
      security: [{ actor: [] }]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/ActorName"
      responses:
        "204":
          description: Undone
        "404":
          description: Event not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The event has no undo payload (message `This can't be undone`), has already
            been undone (message `Already undone`, checked first), would revert a later change
            (message `Undo the later changes to this plant first` or `Undo the later changes
            to this area first`), or would bring back a plant or area into a room that is at
            its limit (the same messages as `addPlant` and `addArea`).
            A later change is a not-undone event after this one in feed order (`created_at`,
            then save order) for the same plant (`room_plant_id`) or area (`area_id` of
            `restore_area`); posts, undone events and other plants or areas never block.
            Nothing changes and `undone_at` stays null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/follows:
    post:
      tags: [Follows]
      operationId: followRoom
      x-service-method: followRoom
      summary: Follow a room by email (double opt-in)
      description: |
        No actor is needed. The server trims and lowercases the email and stores an
        unconfirmed follow, then (after the commit) emails a link to
        `<FERNSLOP_PUBLIC_URL>/confirm-follow#token=…`. Only confirmed follows get the
        weekly digest, which is a scheduled job, not an endpoint. Follows stored before
        double opt-in count as unconfirmed.

        The answer is always `201` with only `room_id` and `email`, so it never reveals
        whether the address already follows the room. Following again while unconfirmed
        re-sends the email and restarts the 7 days to confirm; once confirmed it sends
        nothing. A failed send is logged and still answers `201`.

        The response **must not** include the token. Otherwise anyone could confirm or
        unsubscribe any address they know.

        Besides the per-IP limit, each address (case-insensitive) may make at most 3
        follow requests per 24 hours across all rooms. Every request with a valid email
        counts, whether it creates a follow, re-sends the link or sends nothing because
        the follow is confirmed. A 4th answers `429` (same body and `Retry-After` as the
        per-IP limit, in seconds until the oldest counted request is 24 hours old), sends
        nothing and changes nothing; it looks the same whatever state the address is in.
        There is no per-room cap. Follows still unconfirmed 7 days after their last
        request are deleted by the daily purge. The mock service never caps.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: Follow requested (new, repeated or already confirmed alike)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomFollow" }
        "400":
          description: Invalid email. Message is `That email doesn't look right`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /follows/confirm:
    post:
      tags: [Follows]
      operationId: confirmFollow
      x-service-method: confirmFollow
      summary: Confirm a follow using the token from the confirmation email
      description: |
        Idempotent. Returns `confirmed: true` and starts digests, also when the follow was
        confirmed already. Returns `confirmed: false` and changes nothing if the token
        matched nothing or the follow was left unconfirmed for more than 7 days (follow
        again to get a new link). Called once by the `/confirm-follow` page, which reads
        the token from the URL fragment.
      security: [{ unsubscribeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [confirmed]
                properties:
                  confirmed: { type: boolean }
        "400":
          description: "`token` is not a string. Message is `token must be a string`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /follows/unsubscribe:
    post:
      tags: [Follows]
      operationId: unfollow
      x-service-method: unfollow
      summary: Unsubscribe using the token from a digest email
      description: |
        Idempotent. Returns `unsubscribed: false` if the token matched nothing. The token is
        only ever sent in emails; the `/unsubscribe` page reads it from the link's fragment
        (`#token=…`, or the older `?token=…`) and calls this once.
      security: [{ unsubscribeToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [unsubscribed]
                properties:
                  unsubscribed: { type: boolean }
        "413":
          $ref: "#/components/responses/JsonBodyTooLarge"
        "415":
          $ref: "#/components/responses/NotJson"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/live:
    get:
      tags: [Realtime]
      operationId: subscribe
      x-service-method: subscribe
      summary: Live change notifications for a room (Server-Sent Events)
      description: |
        A long-lived `text/event-stream`. The server sends `event: change` with `data: <roomId>`
        after any mutation in the room, including mutations by other clients. The frontend
        doesn't need a diff. On each message it refetches `GET /rooms/{roomId}` and
        `GET /rooms`. Send a comment line (`: ping`) every 25 s or so to keep the connection
        open. Clients reconnect with EventSource's built-in retry.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: change
                data: room_abc123

        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    actor:
      type: apiKey
      in: header
      name: X-Device-Id
      description: |
        Not authentication. The anonymous actor's stable device UUID, generated in the
        browser. Must be sent together with the `X-Actor-Name` header. Stored as
        `FeedEvent.device_id`.
    unsubscribeToken:
      type: http
      scheme: bearer
      description: |
        For documentation only. The capability is the `token` field in the request body,
        not an Authorization header.

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoomPlantId:
      name: roomPlantId
      in: path
      required: true
      schema: { type: string }
    AreaId:
      name: areaId
      in: path
      required: true
      schema: { type: string }
    ActorName:
      name: X-Actor-Name
      in: header
      required: true
      description: |
        The actor's display name, for example `Anonymous Hedgehog` (at most 40 characters).
        Stored as `FeedEvent.actor_name` and, for new plants, `RoomPlant.added_by_name`.
        Send it percent-encoded (UTF-8), since header values are ASCII-only. A control or
        format character in the decoded name gives 400 with message
        `X-Actor-Name contains invalid characters.` (the zero-width joiner in emoji such as
        👩‍🌾 is allowed).
      schema: { type: string, maxLength: 120 }

  responses:
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadAreaRequest:
      description: |
        Invalid request body. A control or format character in `label` gives
        `An area label contains invalid characters`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Room (or referenced plant) not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RoomPlantGone:
      description: The room plant doesn't exist or has been removed. Message is `Plant is no longer in this garden`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AreaNotFound:
      description: The area doesn't exist or has been removed. Message is `Area not found`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JsonBodyTooLarge:
      description: |
        The JSON body is over 64 KB (65536 bytes), whether or not `Content-Length` is sent.
        Nothing is written. Message is `Request body is too large`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotJson:
      description: |
        The body was not sent as `application/json` (for example `text/plain`, or no
        `Content-Type`). Parameters and case are ignored, so `application/json; charset=utf-8`
        is accepted. Nothing is written. Message is `Send the request body as application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    TooManyRequests:
      description: |
        Too many writes from this client IP (an IPv6 client counts by its /64). Checked before
        the body is read, and nothing is written. Each limit has its own bucket, per IP:
        createRoom 10/hour, deleteRoom 10/hour, uploadPhoto 30/hour and 15/day,
        identifyPlant 20/hour and 20/day, followRoom 10/hour, every other write 120/minute
        (the server can change these). uploadPhoto and identifyPlant check the hourly limit
        first, so a call it rejects does not count against the daily one.
        Message is `You're going a bit fast. Try again in N seconds.`
      headers:
        Retry-After:
          description: Whole seconds until this client may try again.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Shown to the user as-is.

    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 in UTC, for example `2026-10-22T09:30:00.000Z`. The frontend compares these as strings, so always use this exact format.

    PlantCategory:
      type: string
      enum: [flower, vegetable, herb, houseplant, shrub, tree]

    CareType:
      type: string
      enum: [water, feed, prune, harvest]

    AreaShape:
      type: string
      enum: [rect, ellipse]

    AreaColour:
      type: string
      enum: [soil, water, sage, clay]
      description: The frontend renders unknown values as `soil`.

    Percent:
      type: number
      minimum: 0
      maximum: 100
      description: Percentage of canvas width or height, so positions scale.

    Plant:
      type: object
      required: [id, common_name, scientific_name, category, description, image_url,
                 water_every_days, feed_every_days, prune_every_days, harvest_every_days,
                 source, source_url]
      properties:
        id: { type: string, example: plant-tomato }
        common_name: { type: string }
        scientific_name: { type: string }
        category: { $ref: "#/components/schemas/PlantCategory" }
        description: { type: string }
        image_url: { type: [string, "null"] }
        water_every_days:
          type: [integer, "null"]
          description: Null or 0 means this care type doesn't apply. The same applies to the other three intervals.
        feed_every_days: { type: [integer, "null"] }
        prune_every_days: { type: [integer, "null"] }
        harvest_every_days: { type: [integer, "null"] }
        source: { type: string, description: Where the care data came from }
        source_url: { type: string }

    Room:
      type: object
      required: [id, name, description, region, created_at, last_activity_at]
      properties:
        id:
          type: string
          format: uuid
          description: "Server-generated; also the room's URL segment (`/r/{id}`)."
        name: { type: string }
        description: { type: string, description: Empty string when not set }
        region: { type: string, description: Empty string when not set }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_activity_at: { $ref: "#/components/schemas/Timestamp" }

    CreateRoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
          description: Must contain more than whitespace; otherwise 400 with `A room needs a name`.
        description: { type: string, maxLength: 200 }
        region: { type: string, maxLength: 60 }

    RoomPlant:
      type: object
      required: [id, room_id, plant_id, nickname, x_pct, y_pct, last_watered_at, last_fed_at,
                 last_pruned_at, last_harvested_at, added_by_name, created_at, deleted_at]
      properties:
        id: { type: string }
        room_id: { type: string }
        plant_id: { type: string }
        nickname: { type: [string, "null"], description: No endpoint sets this yet }
        x_pct: { $ref: "#/components/schemas/Percent" }
        y_pct: { $ref: "#/components/schemas/Percent" }
        last_watered_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
          description: When null, care timers count from `created_at`.
        last_fed_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        last_pruned_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        last_harvested_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        added_by_name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        deleted_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]

    AreaInput:
      type: object
      required: [label, shape, x_pct, y_pct, w_pct, h_pct, colour]
      properties:
        label: { type: string }
        shape: { $ref: "#/components/schemas/AreaShape" }
        x_pct: { $ref: "#/components/schemas/Percent" }
        y_pct: { $ref: "#/components/schemas/Percent" }
        w_pct: { $ref: "#/components/schemas/Percent" }
        h_pct: { $ref: "#/components/schemas/Percent" }
        colour: { $ref: "#/components/schemas/AreaColour" }

    AreaPatch:
      type: object
      minProperties: 1
      properties:
        label: { type: string }
        shape: { $ref: "#/components/schemas/AreaShape" }
        x_pct: { $ref: "#/components/schemas/Percent" }
        y_pct: { $ref: "#/components/schemas/Percent" }
        w_pct: { $ref: "#/components/schemas/Percent" }
        h_pct: { $ref: "#/components/schemas/Percent" }
        colour: { $ref: "#/components/schemas/AreaColour" }

    RoomArea:
      allOf:
        - $ref: "#/components/schemas/AreaInput"
        - type: object
          required: [id, room_id, deleted_at]
          properties:
            id: { type: string }
            room_id: { type: string }
            deleted_at:
              oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]

    FeedEventType:
      type: string
      enum: [plant_added, plant_removed, plant_moved, care_done, area_changed, post]

    UndoPayload:
      oneOf:
        - type: object
          required: [kind, room_plant]
          properties:
            kind: { const: restore_plant }
            room_plant: { $ref: "#/components/schemas/RoomPlant" }
        - type: object
          required: [kind, room_plant_id]
          properties:
            kind: { const: delete_plant }
            room_plant_id: { type: string }
        - type: object
          required: [kind, area, area_id]
          properties:
            kind: { const: restore_area }
            area:
              oneOf: [{ $ref: "#/components/schemas/RoomArea" }, { type: "null" }]
              description: Null means the area was created by this event, so undo removes it.
            area_id: { type: string }

    FeedEvent:
      type: object
      required: [id, room_id, type, actor_name, device_id, room_plant_id, text, photo_url,
                 undo_payload, undone_at, created_at]
      properties:
        id: { type: string }
        room_id: { type: string }
        type: { $ref: "#/components/schemas/FeedEventType" }
        actor_name: { type: string }
        device_id: { type: string }
        room_plant_id: { type: [string, "null"] }
        text:
          type: string
          description: |
            For system events, a sentence fragment shown after the actor's name, for example
            `added a Tomato` or `renamed "Veg bed" to "Herbs"`. For posts, the user's text.
        photo_url: { type: [string, "null"] }
        undo_payload:
          oneOf: [{ $ref: "#/components/schemas/UndoPayload" }, { type: "null" }]
        undone_at:
          oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }]
        created_at: { $ref: "#/components/schemas/Timestamp" }

    RoomFollow:
      type: object
      description: |
        The answer to a follow request: only what was sent. No id, timestamps or
        confirmation state, which would reveal an earlier follow, and never the token.
      required: [room_id, email]
      additionalProperties: false
      properties:
        room_id: { type: string, format: uuid }
        email: { type: string, format: email }

    Photo:
      type: object
      required: [id, url]
      properties:
        id: { type: string, format: uuid }
        url:
          type: string
          description: Where to load the image from. The mock returns a `data:` URL.

    RoomSummary:
      type: object
      required: [room, plants, areas]
      description: Just enough data to draw a room's thumbnail on the index page.
      properties:
        room: { $ref: "#/components/schemas/Room" }
        plants:
          type: array
          items:
            type: object
            required: [x_pct, y_pct, category]
            properties:
              x_pct: { $ref: "#/components/schemas/Percent" }
              y_pct: { $ref: "#/components/schemas/Percent" }
              category: { $ref: "#/components/schemas/PlantCategory" }
        areas:
          type: array
          items: { $ref: "#/components/schemas/RoomArea" }

    RoomPage:
      type: object
      required: [rooms, next]
      properties:
        rooms:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RoomSummary" }
        next:
          type: [string, "null"]
          description: Cursor for the next page (pass as `before`), or null on the last page.

    FeedPage:
      type: object
      required: [events, next]
      properties:
        events:
          type: array
          maxItems: 100
          description: Newest first.
          items: { $ref: "#/components/schemas/FeedEvent" }
        next:
          type: [string, "null"]
          description: Cursor for the next, older page (pass as `before`), or null on the last page.

    RoomState:
      type: object
      required: [room, plants, areas, feed, feed_next]
      properties:
        room: { $ref: "#/components/schemas/Room" }
        plants:
          type: array
          items: { $ref: "#/components/schemas/RoomPlant" }
        areas:
          type: array
          items: { $ref: "#/components/schemas/RoomArea" }
        feed:
          type: array
          maxItems: 50
          description: The newest 50 events at most, newest first.
          items: { $ref: "#/components/schemas/FeedEvent" }
        feed_next:
          type: [string, "null"]
          description: Cursor for older events (pass as `before` to `getRoomFeed`), or null when there are none.

    IdentifyCandidate:
      type: object
      required: [plant, confidence]
      properties:
        plant: { $ref: "#/components/schemas/Plant" }
        confidence: { type: number, minimum: 0, maximum: 1 }
